version: '3.8'

services:

  keycloak.db:
    image: postgres:16-alpine
    container_name: keycloak.postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak}"
    volumes:
      - keycloak.db.volume:/var/lib/postgresql/data
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aurashop.keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak.db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak.db:
        condition: service_healthy
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongo.db.catalog:
    image: mongo:8.0-rc
    container_name: catalog.mongo
    restart: always
    ports:
      - "27030:27017"
    volumes:
      - mongo.db.catalog.volume:/data/db
    networks:
      - identity-network

  mongo.db.discount:
    image: mongo:8.0-rc
    container_name: discount.mongo
    restart: always
    ports:
      - "27031:27017"
    volumes:
      - mongo.db.discount.volume:/data/db
    networks:
      - identity-network

  redis.db:
    image: redis:7.0-alpine
    container_name: basket.redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis.db.basket.volume:/data
    networks:
      - identity-network

  sqlserver.order:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order.sqlserver
    user: root
    restart: always
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "${ORDERDB_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserver.order.volume:/var/opt/mssql
    networks:
      - identity-network

volumes:
  keycloak.db.volume:
  mongo.db.catalog.volume:
  mongo.db.discount.volume:
  redis.db.basket.volume:
  sqlserver.order.volume:

networks:
  identity-network:
    driver: bridge
